<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" fill="url(#bg)" rx="12" />

  <!-- Header -->
  <text x="450" y="45" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="22" font-weight="bold">NetBird Mesh Overlay Topology</text>
  <text x="450" y="70" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="14">Encrypted WireGuard Mesh Network Architecture (100.64.0.0/16)</text>

  <!-- Control Plane Card -->
  <rect x="250" y="100" width="400" height="110" rx="10" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="2" filter="url(#glow)" />
  <text x="450" y="130" text-anchor="middle" fill="#60a5fa" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">NetBird Control Plane (Server Stack)</text>
  <text x="450" y="155" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="13">Management API (33073) | Signal Service (10000) | Dashboard (443)</text>
  <text x="450" y="180" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Domain: server.muhager.com | IP: 178.105.49.9</text>

  <!-- Node A Card -->
  <rect x="70" y="320" width="220" height="140" rx="10" fill="url(#cardBg)" stroke="#10b981" stroke-width="2" />
  <text x="180" y="350" text-anchor="middle" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">Node A (Linux Server)</text>
  <text x="180" y="380" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="14">Mesh IP: 100.64.0.1</text>
  <text x="180" y="405" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Interface: wt0 (51820 UDP)</text>
  <text x="180" y="430" text-anchor="middle" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">Status: Active Gateway</text>

  <!-- Node B Card -->
  <rect x="610" y="320" width="220" height="140" rx="10" fill="url(#cardBg)" stroke="#10b981" stroke-width="2" />
  <text x="720" y="350" text-anchor="middle" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold">Node B (WSL / Client)</text>
  <text x="720" y="380" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="14">Mesh IP: 100.64.0.2</text>
  <text x="720" y="405" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Interface: wt0 (51820 UDP)</text>
  <text x="720" y="430" text-anchor="middle" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11">Status: Active Peer</text>

  <!-- Coturn Relay Card -->
  <rect x="340" y="380" width="220" height="100" rx="10" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4" />
  <text x="450" y="410" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Coturn STUN/TURN Relay</text>
  <text x="450" y="435" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12">Port 3478 UDP/TCP</text>
  <text x="450" y="460" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">NAT Traversal Fallback</text>

  <!-- Connections -->
  <!-- Control to Node A -->
  <line x1="330" y1="210" x2="180" y2="320" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6" />
  <!-- Control to Node B -->
  <line x1="570" y1="210" x2="720" y2="320" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6" />

  <!-- Direct P2P WireGuard Mesh Line -->
  <path d="M 290 390 L 610 390" stroke="url(#accent)" stroke-width="4" filter="url(#glow)" />
  <text x="450" y="365" text-anchor="middle" fill="#10b981" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">Direct WireGuard P2P Tunnel (ChaCha20-Poly1305)</text>

  <!-- Footer -->
  <text x="450" y="525" text-anchor="middle" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="12">Production NetBird Deployment Repository: netbird-setup</text>
</svg>
