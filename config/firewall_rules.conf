# NetBird Firewall Rules Configuration Matrix
# Production port requirements for NetBird infrastructure

[FIREWALL_INBOUND_RULES]
# WireGuard UDP Encrypted Tunnel Port (P2P Mesh Connections)
UDP / 51820 -> ALLOW ALL (Required for peer-to-peer WireGuard mesh tunnels)

# Coturn STUN / TURN Relay Service (NAT Traversal Fallback)
UDP / 3478  -> ALLOW ALL (STUN/TURN discovery)
TCP / 3478  -> ALLOW ALL (TURN relay over TCP)

# NetBird Signal Service (Peer Exchange gRPC)
TCP / 10000 -> ALLOW ALL (gRPC Peer signaling)

# NetBird Management API Service
TCP / 33073 -> ALLOW ALL (gRPC API & CLI Control Plane)

# Web Dashboard & Public Reverse Proxy
TCP / 80    -> ALLOW ALL (HTTP Certificate ACME Challenge & Redirect)
TCP / 443   -> ALLOW ALL (HTTPS Web Admin Console & gRPC Web)

[FIREWALL_OUTBOUND_RULES]
UDP / 51820 -> ALLOW ALL (Outbound peer WireGuard traffic)
UDP / 3478  -> ALLOW ALL (Outbound STUN queries)
TCP / 443   -> ALLOW ALL (Outbound TLS to Management API)

[KERNEL_SYSCTL_PARMS]
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
