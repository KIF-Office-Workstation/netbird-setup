# NetBird Production Firewall Rules Matrix (Least Privilege)
# Architectural Port Requirements for Reverse Proxy & NetBird Server

[PUBLIC_INBOUND_REQUIRED_PORTS]
# 1. HTTP ACME Challenge & Automatic HTTPS Redirect
TCP / 80    -> ALLOW ALL (Required for Let's Encrypt TLS certificate issuance)

# 2. Unified HTTPS Endpoint (Dashboard, gRPC Management, gRPC Signal, Relay WebSockets)
TCP / 443   -> ALLOW ALL (HTTPS Web UI, gRPC signaling over HTTP/2, Relay over WebSockets)

# 3. STUN / TURN Service (NAT Traversal for Restrictive Networks)
UDP / 3478  -> ALLOW ALL (STUN discovery and TURN relaying for restrictive NATs)

[INTERNAL_CONTAINER_PORTS_DO_NOT_EXPOSE]
# The following ports are internal to Docker bridge network and proxied over 443:
# TCP / 10000 -> INTERNAL ONLY (Signal gRPC service)
# TCP / 33073 -> INTERNAL ONLY (Management gRPC service)

[KERNEL_SYSCTL_REQUIREMENTS]
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
